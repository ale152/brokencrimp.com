        (function () {

            }

                return focus.apply(this, arguments);
            };

            var tapped = null;
            window.addEventListener('pointerup', function (e) {
                tapped = e.pointerType !== 'mouse' && e.defaultPrevented
                    ? composeRoot(e.composedPath()[0]) : null;
            });
            window.addEventListener('touchend', function (e) {

    <style>
        
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5F1EA; touch-action: none; }

<script>
     
    (function () {
        var QUIPS = [
            'Flaking the rope…',
            'Spraying beta…',
            'Brushing the holds…',
            'Chalking up…',
            'Crimping the crimps…',
            'Smearing the walls…',
            'Jamming the cracks…',
            'Dropping the knees…',
            'Finding the kneebar…',
            'Matching the jugs…',
            'Clipping the chains…'
        ];
        var FIRST = 1.8;  
        var SLOT = 2.4;   
        try {
            var hint = document.querySelector('#boot .hint');
            var said = hint && hint.querySelector('.said');
            if (!said) return;
            for (var i = QUIPS.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var swap = QUIPS[i]; QUIPS[i] = QUIPS[j]; QUIPS[j] = swap;
            }

            var share = 100 / QUIPS.length;
            var style = document.createElement('style');
            style.textContent = '@keyframes crimp-quip {' +
                '0% { opacity: 0; transform: translateY(5px); }' +
                (share * 0.12).toFixed(3) + '% { opacity: 1; transform: none; }' +
                (share * 0.85).toFixed(3) + '% { opacity: 1; transform: none; }' +
                share.toFixed(3) + '%, 100% { opacity: 0; transform: translateY(-5px); } }';
            document.head.appendChild(style);
            var cycle = QUIPS.length * SLOT;
            QUIPS.forEach(function (words, k) {
                var line = document.createElement('span');
                line.className = 'quip';
                line.setAttribute('aria-hidden', 'true');
                line.textContent = words;
                line.style.animation = 'crimp-quip ' + cycle + 's linear ' + (FIRST + k * SLOT) + 's infinite both';
                hint.appendChild(line);
            });
            said.style.animation = 'crimp-said ' + FIRST + 's linear forwards';
        } catch (e) {   }
    })();
</script>
<script>

<script type="application/javascript">
     
    window.brokenCrimpReady = function () {
        if (window.brokenCrimpWatch) window.brokenCrimpWatch.end();
        var boot = document.getElementById('boot');
        if (!boot) return;

        var root = document.documentElement;
        root.style.setProperty('--boot', '1');
        if (root.hasAttribute('data-boot')) root.setAttribute('data-boot', 'done');
        boot.classList.add('gone');

        window.setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 220);
    };

    (function () {

        var retry = document.getElementById('boot-retry');
        if (retry) retry.addEventListener('click', function () { window.location.reload(); });

        var cannotRun = document.documentElement.getAttribute('data-cannot-start') === 'browser';
        if (cannotRun) {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistration().then(function (registration) {
                    if (registration) return registration.unregister();

                    return Promise.all(names.filter(function (name) {
                        return name.indexOf('brokencrimp-') === 0;
                    }).map(function (name) { return caches.delete(name); }));
                }).catch(function () {   });
            }
        }

        if (!cannotRun && 'serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (e) {

                    console.warn('Broken Crimp: the offline worker did not register', e);
                });
            });
        }
    })();
